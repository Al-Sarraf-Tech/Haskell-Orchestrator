name: Orchestrator Scan (Reusable)

on:
  workflow_call:
    inputs:
      fail-on:
        description: "Severity threshold for CI failure (info|warning|error|critical|none)"
        required: false
        type: string
        default: "error"
      tags:
        description: "Comma-separated rule tags to evaluate (security,performance,cost,style,structure)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  orchestrator-scan:
    name: Orchestrator Workflow Scan
    runs-on: [self-hosted, Linux, X64, fleet-small]
    timeout-minutes: 5
    env:
      SCAN_FAIL_ON: ${{ inputs.fail-on }}
      SCAN_TAGS: ${{ inputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned orchestrator
        shell: bash
        run: |
          # Fresh uci VM: download the public, sha256-verified release into the job's temp dir.
          # (The Enterprise edition lives in a private repo and cannot be fetched without credentials;
          # this is the public edition, same CLI, 36 rules.)
          VERSION="4.0.2"
          ARCHIVE="haskell-orchestrator-${VERSION}-linux-x86_64.tar.gz"
          SHA256="eed8b54c7c2eee1dfd89e0237924738706a5471d6492308e64a71303e7c94b3f"
          TOOLS="${RUNNER_TEMP:?}/orchestrator-tools"
          mkdir -p "$TOOLS"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            "https://github.com/Al-Sarraf-Tech/Haskell-Orchestrator/releases/download/v${VERSION}/${ARCHIVE}" \
            -o "$TOOLS/$ARCHIVE"
          echo "${SHA256}  $TOOLS/$ARCHIVE" | sha256sum --check --strict -
          tar -xzf "$TOOLS/$ARCHIVE" -C "$TOOLS" "haskell-orchestrator-${VERSION}-linux-x86_64/orchestrator"
          install -m 0755 "$TOOLS/haskell-orchestrator-${VERSION}-linux-x86_64/orchestrator" "$TOOLS/orchestrator"
          "$TOOLS/orchestrator" --help | head -1

      - name: Run Orchestrator scan
        shell: bash
        run: |
          ORCH="${RUNNER_TEMP:?}/orchestrator-tools/orchestrator"

          # Global flags go before the subcommand
          GLOBAL_FLAGS=""
          if [ "$SCAN_FAIL_ON" != "none" ] && [ -n "$SCAN_FAIL_ON" ]; then
            GLOBAL_FLAGS="$GLOBAL_FLAGS --fail-on $SCAN_FAIL_ON"
          fi

          if [ -n "$SCAN_TAGS" ]; then
            for tag in $(echo "$SCAN_TAGS" | tr ',' ' '); do
              GLOBAL_FLAGS="$GLOBAL_FLAGS --tags $tag"
            done
          fi

          # The scanner takes the repository root and finds .github/workflows itself; pointing it at
          # .github/workflows/ made it look for .github/workflows inside that directory and scan 0 files.
          echo "Running: orchestrator $GLOBAL_FLAGS scan . (36 rules)"
          "$ORCH" $GLOBAL_FLAGS scan .
